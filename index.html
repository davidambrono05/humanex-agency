<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO principal. Titlul și descrierea sunt în română fiindcă de acolo
         vine majoritatea traficului; App.tsx le rescrie în engleză când
         vizitatorul are browserul pe altă limbă. -->
    <title>HUMANEX — Software la comandă și promovare pentru afaceri | Brașov</title>
    <meta name="description" content="Construim software la comandă — sisteme de raportare, panouri de control, site-uri — și aducem clienți prin campanii Meta și TikTok. Din Brașov, pentru clienți din România și din afară." />
    <meta name="keywords" content="software la comanda Romania, sisteme de raportare, automatizare afaceri, agentie marketing Brasov, Meta Ads Romania, TikTok Ads, custom software Romania, business automation, HUMANEX, AMBRONUS SRL" />
    <meta name="author" content="HUMANEX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://humanex.space" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://humanex.space" />
    <meta property="og:title" content="HUMANEX — Sisteme care lucrează cât timp tu dormi" />
    <meta property="og:description" content="Software la comandă pentru afaceri mici și mijlocii, plus campanii Meta și TikTok. Vezi CloseCheck, Energoprest și celelalte proiecte." />
    <meta property="og:image" content="https://humanex.space/og-image.png" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:site_name" content="HUMANEX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://humanex.space" />
    <meta name="twitter:title" content="HUMANEX — Custom software & marketing for small business" />
    <meta name="twitter:description" content="Bespoke software, reporting systems and Meta/TikTok campaigns. Based in Romania, working with clients anywhere." />
    <meta name="twitter:image" content="https://humanex.space/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Date structurate -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HUMANEX",
      "legalName": "AMBRONUS SRL",
      "url": "https://humanex.space",
      "logo": "https://humanex.space/favicon.svg",
      "description": "Agenție de software și promovare din Brașov. Construim software la comandă — sisteme de raportare, panouri de control, site-uri — și administrăm campanii Meta Ads și TikTok Ads pentru afaceri mici și mijlocii.",
      "founder": {
        "@type": "Person",
        "name": "David Ambrono"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Brașov",
        "addressRegion": "Brașov",
        "addressCountry": "RO"
      },
      "areaServed": [
        { "@type": "Country", "name": "România" },
        { "@type": "Place", "name": "European Union" }
      ],
      "knowsLanguage": ["ro", "en"],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "humanex23@gmail.com",
        "availableLanguage": ["Romanian", "English"]
      },
      "sameAs": ["https://humanex.space"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servicii HUMANEX",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Sistem de raportare",
            "price": "1000",
            "priceCurrency": "EUR",
            "description": "Echipa completează raportul de pe telefon, proprietarul îl primește pe email și WhatsApp în câteva secunde — preț de proiect"
          },
          {
            "@type": "Offer",
            "name": "Panou de control la comandă",
            "price": "1500",
            "priceCurrency": "EUR",
            "description": "Clienți, lucrări, echipe și facturi într-un singur loc, construit pe fluxul afacerii — preț de proiect"
          },
          {
            "@type": "Offer",
            "name": "Site de firmă",
            "price": "700",
            "priceCurrency": "EUR",
            "description": "Site complet, cu design premium, analytics și automatizări de bază — preț de proiect"
          },
          {
            "@type": "Offer",
            "name": "Social Media + Reclame",
            "price": "300",
            "priceCurrency": "EUR",
            "description": "O postare zilnică, 8 reels pe lună, plus campanii Meta Ads și TikTok Ads administrate — abonament lunar"
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
