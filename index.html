<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO principal. Titlul și descrierea sunt în română fiindcă de acolo
         vine majoritatea traficului; App.tsx le rescrie în engleză când
         vizitatorul are browserul pe altă limbă. -->
    <title>HUMANEX — Reclame plătite și sisteme la comandă | Brașov</title>
    <meta name="description" content="Reclame plătite pe Facebook, Instagram, TikTok și ChatGPT, cu clipurile făcute de noi, plus software la comandă: rapoarte automate, panouri de control și site-uri. Din Brașov." />
    <meta name="keywords" content="reclame platite Brasov, agentie reclame Facebook, Meta Ads Romania, TikTok Ads, ChatGPT Ads, mascote AI, software la comanda Romania, sisteme de raportare, automatizare afaceri, HUMANEX, AMBRONUS SRL" />
    <meta name="author" content="HUMANEX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://humanex.space" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://humanex.space" />
    <meta property="og:title" content="HUMANEX — Îți aducem clienți. Și îți automatizăm munca." />
    <meta property="og:description" content="Reclame plătite pe Meta, TikTok și ChatGPT, cu clipurile făcute de noi, și sisteme la comandă pentru afaceri mici și mijlocii." />
    <meta property="og:image" content="https://humanex.space/og-image.png" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:site_name" content="HUMANEX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://humanex.space" />
    <meta name="twitter:title" content="HUMANEX — Paid ads and custom systems for small business" />
    <meta name="twitter:description" content="Paid ads on Meta, TikTok and ChatGPT, plus bespoke software and reporting systems. Based in Romania." />
    <meta name="twitter:image" content="https://humanex.space/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Date structurate -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HUMANEX",
      "legalName": "AMBRONUS SRL",
      "url": "https://humanex.space",
      "logo": "https://humanex.space/favicon.svg",
      "description": "Agenție din Brașov cu două servicii: reclame plătite pe Facebook, Instagram, TikTok și ChatGPT, cu clipurile făcute de noi, și software la comandă — sisteme de raportare, panouri de control, site-uri — pentru afaceri mici și mijlocii.",
      "founder": {
        "@type": "Person",
        "name": "David Ambrono"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Brașov",
        "addressRegion": "Brașov",
        "addressCountry": "RO"
      },
      "areaServed": [
        { "@type": "Country", "name": "România" },
        { "@type": "Place", "name": "European Union" }
      ],
      "knowsLanguage": ["ro", "en"],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "ambronus@humanex.space",
        "availableLanguage": ["Romanian", "English"]
      },
      "sameAs": ["https://humanex.space"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servicii HUMANEX",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Sistem de raportare",
            "price": "1000",
            "priceCurrency": "EUR",
            "description": "Echipa completează raportul de pe telefon, proprietarul îl primește pe email și WhatsApp în câteva secunde — preț de proiect"
          },
          {
            "@type": "Offer",
            "name": "Panou de control la comandă",
            "price": "1500",
            "priceCurrency": "EUR",
            "description": "Clienți, lucrări, echipe și facturi într-un singur loc, construit pe fluxul afacerii — preț de proiect"
          },
          {
            "@type": "Offer",
            "name": "Site de firmă",
            "price": "700",
            "priceCurrency": "EUR",
            "description": "Site complet, cu design premium, analytics și automatizări de bază — preț de proiect"
          },
          {
            "@type": "Offer",
            "name": "Reclame plătite",
            "description": "Reclame pe Facebook, Instagram, TikTok și ChatGPT, cu clipurile făcute de noi, administrate și îmbunătățite săptămânal — abonament lunar"
          }
        ]
      }
    }
    </script>
    <!-- Vercel Web Analytics: numără vizitatorii, fără cookie-uri.
         Datele apar în Vercel → proiect → Analytics. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
